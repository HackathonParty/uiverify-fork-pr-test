name: Visual tests

# Runs the visual tests. For a push or a same-repo pull request it uploads to UI Verify here, and the
# job stays red until the changes are accepted (visual-rerun.yml then re-runs it green). A pull request
# from a fork gets no secrets, so it saves the capture as an artifact instead and visual-upload.yml
# uploads it.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:uiverify
      - name: Upload to UI Verify
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          UIVERIFY_API_KEY: ${{ secrets.UIVERIFY_API_KEY }}
        run: npx -y uiverify@1.7.0 upload --static-dir uiverify-archive --only-changed
      - name: Save the capture for the upload workflow
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@v4
        with:
          name: uiverify-archive
          path: uiverify-archive/
          if-no-files-found: error
          retention-days: 7
